<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read It Easier</title>
<meta name="description" content="幫助繁體中文使用者閱讀英文文獻：選字翻譯、專有名詞說明、分類生詞表與重點句。">
<meta name="theme-color" content="#1a1918">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* Palette: a dim concrete room — charcoal walls, black leather, steel shelving, one warm lamp. */
:root{
  --bg:#1a1918; --wall:#262524; --panel:#201f1e; --card:#2b2a28; --raise:#34322f;
  --line:#3c3a36; --line-soft:#302e2b; --steel:#8d8a84;
  --ink:#ece7de; --muted:#9b958b; --faint:#6f6a62;
  --lamp:#e2b36f; --lamp-soft:rgba(226,179,111,.12); --lamp-line:rgba(226,179,111,.34); --lamp-ink:#1a1918;
  --danger:#e08571; --paper:#f4f1ea;
  --shadow:0 14px 40px rgba(0,0,0,.5);
  --serif:"Cormorant Garamond","Songti TC","Noto Serif TC",Georgia,serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(226,179,111,.35)}
*{scrollbar-width:thin;scrollbar-color:#45423e transparent}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line-soft);min-height:54px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:4px}
.brand img{width:30px;height:30px;border-radius:8px;display:block;background:#fff}
.brand span{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.01em;line-height:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;line-height:1.2;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--raise);border-color:#514e49}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:11px 26px;font-size:16px;border-radius:11px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.group{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
.group button{border:0;background:none;padding:6px 10px;font-size:14px;line-height:1.2}
.group button:hover:not(:disabled){background:var(--raise)}
.group button:disabled{opacity:.35;cursor:default}
.group .zoomlbl{min-width:46px;text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.group input[type=number]{width:44px;padding:6px 2px 6px 8px;border:0;background:none;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.group input[type=number]::-webkit-outer-spin-button,.group input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.group input:focus{outline:none}
.group .tot{padding:0 10px 0 4px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:1fr 400px;min-height:0}
.viewer{overflow:auto;position:relative;padding:22px 0 90px;
  background:radial-gradient(1100px 620px at 8% -8%, rgba(226,179,111,.10), transparent 62%), linear-gradient(180deg,#232221,#1a1918 55%)}
.viewer.drag{outline:2px dashed var(--lamp);outline-offset:-12px}
.page{position:relative;margin:0 auto 18px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.38)}
.page canvas{display:block;position:absolute;inset:0}
.page .ph{position:absolute;right:10px;bottom:6px;font-size:11px;color:#b9b5aa}
.page .hl{position:absolute;background:rgba(240,186,84,.42);mix-blend-mode:multiply;pointer-events:none;border-radius:2px}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(214,150,40,.38)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}

.empty{height:100%;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center}
.empty .hero{width:168px;height:168px;border-radius:6px;background:#fff;display:block;border:9px solid #111;outline:1px solid #3a3835;box-shadow:0 22px 50px rgba(0,0,0,.55)}
.empty h1{font-family:var(--serif);font-weight:500;font-size:46px;letter-spacing:.01em;margin:0;line-height:1}
.banner{margin:0 auto 14px;max-width:720px;background:var(--lamp-soft);border:1px solid var(--lamp-line);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.6}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line-soft);padding:0 10px;gap:2px;align-items:stretch;min-height:46px}
.tab{border:0;background:none;padding:13px 11px 11px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab small{font-size:11.5px;color:var(--faint);margin-left:3px;font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--lamp)}
.switch{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);user-select:none;cursor:pointer;padding-right:4px;white-space:nowrap}
.switch input{accent-color:var(--lamp)}
.side-body{overflow:auto;padding:16px 16px 28px;flex:1}
.idle{color:var(--faint);font-family:var(--serif);font-style:italic;font-size:22px;text-align:center;padding:64px 10px 20px}
.hint{color:var(--muted);line-height:1.7;font-size:14px;padding:6px 2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card-top{display:flex;gap:8px;align-items:flex-start}
.card .orig{font-size:20px;font-weight:700;line-height:1.35;word-break:break-word;flex:1}
.card .orig.long{font-family:var(--serif);font-size:18px;font-weight:500;font-style:italic;color:#cfc9be;line-height:1.5}
.starbtn{border:0;background:none;font-size:22px;line-height:1;padding:2px 4px;color:#5c5852}
.starbtn.on{color:var(--lamp)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:8px 0 2px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;line-height:1.7;background:var(--raise);color:#c9c3b8}
.chip.term,.chip.hlchip{background:var(--lamp-soft);color:var(--lamp);border:1px solid var(--lamp-line)}
.chip.plain{background:var(--raise);color:#c9c3b8}
.trans{font-size:18px;line-height:1.65;margin:12px 0 4px}
.sub{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}
.sub b{color:var(--ink);font-weight:600}
.termbox{margin-top:14px;background:var(--lamp-soft);border:1px solid var(--lamp-line);border-radius:12px;padding:11px 13px}
.termbox h3{margin:0 0 4px;font-size:12.5px;color:var(--lamp);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.termbox .full{font-size:14px;font-weight:600;margin:2px 0}
.termbox p{margin:4px 0;font-size:14px;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.refbox,.srcbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.7}
.refbox h3,.srcbox h3{margin:0 0 4px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.refbox a{color:var(--lamp);text-decoration:none;word-break:break-word}
.refbox a:hover{text-decoration:underline}
.refbox ul{margin:4px 0 0;padding-left:18px}
.refbox li{margin:3px 0}
.refbox .src{color:var(--muted);font-size:12px}
.refbox .row{margin:4px 0}
.srcbox .cite{color:#d6d0c5;word-break:break-word}
.srcbox .short{color:var(--lamp);font-variant-numeric:tabular-nums}
.srcbox textarea{width:100%;min-height:74px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;resize:vertical}
.linkbtn{border:0;background:none;color:var(--lamp);font-size:12.5px;padding:0}
.listrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.listrow select,.listrow input,.field input,.field select,.inp{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg);min-width:0}
.listrow select{max-width:210px}
select option{background:var(--card);color:var(--ink)}
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#33312e,#403d39,#33312e);background-size:200% 100%;animation:sh 1.2s infinite;margin:11px 0}
@keyframes sh{to{background-position:-200% 0}}
.err{color:var(--danger);font-size:14px;line-height:1.7}

/* ---------- lists ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px;line-height:1.5;color:#cfc9be}
.fchip:hover{border-color:#57534d}
.fchip.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);font-weight:600}
.fchip small{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.vtools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.vtools:empty,.filters:empty{display:none}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vlist li{border:1px solid var(--line-soft);background:var(--card);border-radius:11px;padding:9px 10px 9px 4px;display:grid;grid-template-columns:auto 1fr auto;gap:0 4px;align-items:center;font-size:14px;cursor:pointer}
.vlist li:hover{border-color:#57534d}
.vlist li.sent{align-items:start}
.vlist .starbtn{font-size:18px}
.vlist .o{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vlist .sent .o{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.4}
.vlist .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.vlist .sent .t{color:var(--lamp);font-size:12px;margin-top:4px}
.vlist .l{font-size:11px;color:var(--faint);text-align:right;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest{background:var(--lamp-soft);border:1px solid var(--lamp-line);border-radius:10px;padding:8px 10px 8px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}

/* ---------- floating ---------- */
#fab{position:fixed;z-index:20;display:none;box-shadow:var(--shadow);border-radius:999px;padding:8px 18px;background:var(--lamp);color:var(--lamp-ink);border:0;font-size:14px;font-weight:600}
#fab.show{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0e0d0d;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
.toast.show{opacity:1}

.modal{position:fixed;inset:0;background:rgba(8,8,8,.62);z-index:35;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:var(--shadow);max-height:90dvh;overflow:auto}
.sheet h2{margin:0 0 16px;font-family:var(--serif);font-weight:600;font-size:26px}
.sheet h3{margin:20px 0 8px;font-size:13px;color:var(--lamp);font-weight:600;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.field input,.field select{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.check input{accent-color:var(--lamp)}

#sidetoggle{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .bar{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .brand span,.fname,#zfit{display:none}
  .tools{gap:6px}
  .group button{padding:6px 9px}
  .side{position:fixed;left:0;right:0;bottom:0;height:54dvh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -16px 40px rgba(0,0,0,.5);z-index:15;border-radius:18px 18px 0 0;transition:transform .22s}
  .side.collapsed{transform:translateY(calc(100% - 47px))}
  .viewer{padding:12px 0 56dvh}
  #sidetoggle{display:inline-block}
  .empty h1{font-size:36px}
  .empty .hero{width:132px;height:132px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><img src="icons/app-192.png" alt=""><span>Read It Easier</span></div>
    <label class="btn primary" for="file">開啟 PDF</label>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    <span class="fname" id="fname"></span>
    <div class="tools">
      <div class="group">
        <button id="zout" title="縮小" aria-label="縮小" disabled>−</button>
        <span class="zoomlbl" id="zlbl">—</span>
        <button id="zin" title="放大" aria-label="放大" disabled>＋</button>
        <button id="zfit" title="符合寬度" disabled>符合寬度</button>
      </div>
      <div class="group">
        <input id="pg" type="number" min="1" value="1" disabled aria-label="頁碼">
        <span class="tot" id="pgtot">/ –</span>
      </div>
      <button class="btn sm" id="sidetoggle">面板</button>
      <button class="btn sm" id="setbtn" hidden>設定</button>
    </div>
  </header>

  <div class="layout">
    <main class="viewer" id="viewer">
      <div class="empty" id="empty">
        <img class="hero" src="icons/hero.png" alt="">
        <h1>Read It Easier</h1>
        <label class="btn primary lg" for="file">開啟 PDF</label>
      </div>
    </main>

    <aside class="side" id="side">
      <div class="tabs">
        <button class="tab on" id="tab-tr" data-tab="tr">翻譯</button>
        <button class="tab" id="tab-vo" data-tab="vo">生詞<small id="vcount"></small></button>
        <button class="tab" id="tab-hl" data-tab="hl">重點句<small id="hcount"></small></button>
        <label class="switch"><input type="checkbox" id="auto"> 自動翻譯</label>
      </div>
      <div class="side-body" id="pane-tr">
        <div id="current"></div>
      </div>
      <div class="side-body" id="pane-vo" hidden>
        <div id="suggest"></div>
        <div class="filters" id="filters"></div>
        <div class="vtools" id="vtools"></div>
        <ul class="vlist" id="vlist"></ul>
      </div>
    </aside>
  </div>
</div>
<button id="fab" type="button">翻譯</button>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>設定</h2>
    <h3>翻譯來源</h3>
    <label class="field">
      <select id="s-src" aria-label="翻譯來源">
        <option value="free">免費：Chrome 內建翻譯＋維基百科＋PubMed</option>
        <option value="google">Google 翻譯＋維基百科＋PubMed</option>
        <option value="claude">Claude</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="s-refs"> Claude 的專有名詞附上維基百科與 PubMed</label>
    <h3>GOOGLE API 金鑰</h3>
    <label class="field"><input id="s-gkey" type="password" placeholder="AIza..." autocomplete="off" aria-label="Google API 金鑰"></label>
    <h3>CLAUDE API 金鑰</h3>
    <label class="field"><input id="s-key" type="password" placeholder="sk-ant-..." autocomplete="off" aria-label="Claude API 金鑰"></label>
    <label class="field">單字模型<input id="s-mq" type="text"></label>
    <label class="field">句子與分類模型<input id="s-md" type="text"></label>
    <h3>備份</h3>
    <div class="actions" style="margin-top:0">
      <button class="btn sm" id="s-export">匯出備份</button>
      <label class="btn sm" for="s-import">匯入備份</label>
      <input id="s-import" type="file" accept="application/json,.json" hidden>
      <button class="btn sm" id="s-tsv">匯出表格</button>
    </div>
    <div class="actions" style="justify-content:flex-end;margin-top:22px">
      <button class="btn" id="s-cancel">取消</button>
      <button class="btn primary" id="s-save">儲存</button>
    </div>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script>
(function(){
"use strict";
const APP_VERSION = '1.3.2';
const $ = s => document.querySelector(s);
const cur = $('#current');
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false||c==='') continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }

/* =====================================================================
   Asking Claude: inside Claude (artifact) → the viewer's Claude account;
   as a standalone app → the user's own API key.
   ===================================================================== */
const inClaude = !!(window.claude && window.claude.use);
const hasChromeTr = 'Translator' in self;   // desktop Chrome's built-in on-device translator
let sample = null;
const settings = Object.assign({apiKey:'', googleKey:'', source:'', refs:true, modelQuick:'claude-haiku-5-5', modelDefault:'claude-sonnet-5-5', auto:false}, lsGet('rie.settings.v1')||{});
/* 'claude', 'google' or 'free'. Inside Claude it is always Claude; in the app the user chooses (default: Claude if a key is saved, else free). */
function source(){ return inClaude ? 'claude' : (settings.source || (settings.apiKey ? 'claude' : 'free')); }
const canFetchRefs = !inClaude;   // pages inside Claude cannot reach other sites
const ready = (async()=>{
  if(inClaude){ try{ sample = await claude.use('sample'); }catch(e){ sample=null; } }
  else { $('#setbtn').hidden=false; }
})();
ready.then(()=>renderIdle());
function canAsk(){ return !!sample || (!inClaude && !!settings.apiKey); }
function parseJSON(text){
  try{ return JSON.parse(text); }catch(e){}
  const a=text.indexOf('{'), b=text.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(text.slice(a,b+1)); }catch(e){} }
  throw {code:'invalid_json'};
}
async function askJSON(prompt, tier, signal){
  if(sample) return sample.json(prompt,{modelTier:tier, signal});
  if(inClaude) throw {code:'unavailable'};
  if(!settings.apiKey) throw {code:'no_key'};
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', signal,
      headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model: tier==='quick'?settings.modelQuick:settings.modelDefault, max_tokens: tier==='quick'?1500:8000, messages:[{role:'user',content:prompt}]})
    });
  }catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'network'}; }
  if(!res.ok) throw {code: res.status===401||res.status===403 ? 'bad_key' : res.status===404 ? 'bad_model' : res.status===429 ? 'rate_limited' : 'upstream_error'};
  const j = await res.json();
  return parseJSON((j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(''));
}

/* =====================================================================
   Free reference sources: Wikipedia (zh-tw title + summary) and PubMed
   ===================================================================== */
async function getJSON(url, signal, headers){
  let r;
  try{ r = await fetch(url,{signal, headers}); }
  catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'network'}; }
  if(!r.ok) throw {code: r.status===429 ? 'rate_limited' : 'network'};
  return r.json();
}
async function wikiLookup(q, signal){
  const d = await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(q)+'&prop=extracts%7Clanglinks%7Cinfo&exintro=1&explaintext=1&exsentences=3&lllang=zh&inprop=url', signal);
  const pg = d && d.query && d.query.pages && Object.values(d.query.pages)[0];
  if(!pg || !pg.title) return null;
  const out = {title:pg.title, url:pg.fullurl||('https://en.wikipedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_'))), extract:String(pg.extract||'').trim(), zhTitle:'', zhUrl:'', zhExtract:''};
  const ll = pg.langlinks && pg.langlinks[0] && pg.langlinks[0]['*'];
  if(ll){
    out.zhTitle = ll;
    out.zhUrl = 'https://zh.wikipedia.org/zh-tw/'+encodeURIComponent(ll.replace(/ /g,'_'));
    try{  // Accept-Language: zh-tw makes Wikipedia return Taiwan-variant Traditional Chinese
      const z = await getJSON('https://zh.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(ll.replace(/ /g,'_')), signal, {'Accept-Language':'zh-tw'});
      if(z && z.title){ out.zhTitle = String(z.title); out.zhExtract = String(z.extract||'').trim(); }
    }catch(e){ if(e && e.code==='cancelled') throw e; }
  }
  return out;
}
async function pubmedLookup(q, signal){
  const term = '"'+q.replace(/"/g,'')+'"[Title/Abstract]';
  const base = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
  const s = await getJSON(base+'esearch.fcgi?db=pubmed&retmode=json&retmax=3&sort=relevance&term='+encodeURIComponent(term), signal);
  const er = (s && s.esearchresult) || {};
  const ids = Array.isArray(er.idlist) ? er.idlist : [];
  let items = [];
  if(ids.length){
    try{
      const m = await getJSON(base+'esummary.fcgi?db=pubmed&retmode=json&id='+ids.join(','), signal);
      items = ids.map(id=>m.result && m.result[id]).filter(Boolean).map(x=>({pmid:String(x.uid), title:String(x.title||''), journal:String(x.source||''), year:String(x.pubdate||'').slice(0,4)}));
    }catch(e){ if(e && e.code==='cancelled') throw e; }
  }
  return {count:+er.count||0, items, url:'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(term)};
}
/* Machine translation without Claude: Chrome's built-in on-device translator (desktop Chrome), or Google Cloud Translation with the user's key. */
let chromeTr = null;
async function chromeTranslate(text){
  if(!hasChromeTr) return null;
  try{
    if(!chromeTr){
      const o = {sourceLanguage:'en', targetLanguage:'zh-Hant'};
      if(self.Translator.availability && await self.Translator.availability(o)==='unavailable') return null;
      chromeTr = await self.Translator.create(Object.assign({monitor(m){ m.addEventListener('downloadprogress',e=>{ if(e.loaded<1) toast('正在下載 Chrome 翻譯模型 '+Math.round(e.loaded*100)+'%'); }); }}, o));
    }
    return String(await chromeTr.translate(text)).trim() || null;
  }catch(e){ return null; }
}
async function googleTranslate(text, signal){
  if(!settings.googleKey) throw {code:'bad_gkey'};
  let r;
  try{
    r = await fetch('https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(settings.googleKey),{
      method:'POST', signal, headers:{'content-type':'application/json'},
      body:JSON.stringify({q:text, source:'en', target:'zh-TW', format:'text'})});
  }catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'network'}; }
  if(!r.ok) throw {code: r.status===400||r.status===401||r.status===403 ? 'bad_gkey' : r.status===429 ? 'rate_limited' : 'network'};
  const j = await r.json();
  const t = j && j.data && j.data.translations && j.data.translations[0] && j.data.translations[0].translatedText;
  if(!t) throw {code:'network'};
  return String(t);
}
async function machineTranslate(text, signal){
  if(source()==='google') return {text: await googleTranslate(text, signal), via:'Google 翻譯'};
  const t = await chromeTranslate(text);
  return t ? {text:t, via:'Chrome 內建翻譯'} : null;
}
async function fetchRefs(q, signal){
  const [w,p] = await Promise.allSettled([wikiLookup(q,signal), pubmedLookup(q,signal)]);
  for(const x of [w,p]) if(x.status==='rejected' && x.reason && x.reason.code==='cancelled') throw x.reason;
  return {q, wiki: w.status==='fulfilled' ? w.value : null, pubmed: p.status==='fulfilled' ? p.value : null, failed: w.status==='rejected' && p.status==='rejected'};
}

const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;

const viewer = $('#viewer');
let pdfDoc=null, docName='', scale=1.3, gen=0, pageEls=[], pageTexts={}, observer=null, baseSize=null, textCount=0, renderedCount=0, bannerShown=false;

function setControls(on){ ['#zout','#zin','#zfit','#pg'].forEach(s=>$(s).disabled=!on); }

async function openFile(file){
  if(!file) return;
  if(!pdfjsLib){ toast('PDF 引擎載入失敗，請重新整理'); return; }
  if(!/pdf$/i.test(file.name) && file.type!=='application/pdf'){ toast('請選擇 PDF 檔案'); return; }
  try{
    const buf = new Uint8Array(await file.arrayBuffer());
    const doc = await pdfjsLib.getDocument({data:buf}).promise;
    pdfDoc = doc; pageTexts={}; textCount=0; renderedCount=0; bannerShown=false;
    docName = file.name.replace(/\.pdf$/i,'');
    $('#fname').textContent = file.name; $('#fname').title=file.name;
    const p1 = await doc.getPage(1);
    const vp1 = p1.getViewport({scale:1});
    baseSize = {w:vp1.width,h:vp1.height};
    $('#pg').max = doc.numPages; $('#pg').value = 1; $('#pgtot').textContent = '/ '+doc.numPages;
    setControls(true);
    fitWidth(false);
    buildPages();
  }catch(e){
    console.error(e);
    toast(e && e.name==='PasswordException' ? '此 PDF 有密碼保護，暫不支援' : '無法開啟此 PDF');
  }
}
function fitWidth(rebuild=true){
  if(!baseSize) return;
  const avail = viewer.clientWidth - (window.innerWidth<=860 ? 16 : 56);
  scale = Math.max(.5, Math.min(3, avail/baseSize.w));
  updZoomLabel();
  if(rebuild) buildPages();
}
function setScale(s){ scale = Math.max(.5, Math.min(3.5, s)); updZoomLabel(); buildPages(true); }

function buildPages(keepPos){
  const myGen = ++gen;
  const ratio = keepPos && viewer.scrollHeight>0 ? viewer.scrollTop/viewer.scrollHeight : 0;
  if(observer) observer.disconnect();
  viewer.textContent='';
  pageEls=[];
  const w = baseSize.w*scale, hgt = baseSize.h*scale;
  const frag = document.createDocumentFragment();
  for(let n=1;n<=pdfDoc.numPages;n++){
    const d = h('div',{class:'page','data-page':n}); d.style.width=w+'px'; d.style.height=hgt+'px';
    d.append(h('span',{class:'ph'},n));
    frag.append(d); pageEls.push(d);
  }
  viewer.append(frag);
  viewer.scrollTop = ratio*viewer.scrollHeight;
  observer = new IntersectionObserver(es=>{
    for(const en of es) if(en.isIntersecting) renderPage(+en.target.dataset.page, myGen);
  },{root:viewer,rootMargin:'900px 0px'});
  pageEls.forEach(el=>observer.observe(el));
  updateCurrentPage();
}

async function renderPage(n, myGen){
  const el = pageEls[n-1];
  if(!el || el.dataset.done==='1' || el.dataset.busy==='1') return;
  el.dataset.busy='1';
  try{
    const page = await pdfDoc.getPage(n);
    if(myGen!==gen) return;
    const vp = page.getViewport({scale});
    el.style.width=vp.width+'px'; el.style.height=vp.height+'px';
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const cv = document.createElement('canvas');
    cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
    cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    const task = page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
    const tc = await page.getTextContent();
    pageTexts[n] = tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ');
    textCount += tc.items.reduce((a,i)=>a+i.str.trim().length,0);
    await task.promise;
    if(myGen!==gen) return;
    const tl = h('div',{class:'textLayer'});
    tl.style.setProperty('--scale-factor', vp.scale);
    el.textContent=''; el.append(cv, tl);
    const divs = [];
    await pdfjsLib.renderTextLayer({textContentSource:tc, container:tl, viewport:vp, textDivs:divs}).promise;
    alignSpans(divs, tc.items, vp.scale);
    tl.append(h('div',{class:'endOfContent'}));
    el.dataset.done='1';
    applyHighlights(n);
    renderedCount++;
    if(!bannerShown && renderedCount>=Math.min(2,pdfDoc.numPages) && textCount<20){
      bannerShown=true;
      viewer.prepend(h('div',{class:'banner'},'這份 PDF 看起來是掃描影像，沒有可選取的文字層，因此無法選字翻譯。請改用含文字層的 PDF，或先用 OCR 工具處理後再上傳。'));
    }
  }catch(e){ if(e && e.name!=='RenderingCancelledException') console.error(e); }
  finally{ delete el.dataset.busy; }
}
/* Paint the saved key sentences of this document onto page n. Sentences are located by their
   letters and digits only, so line breaks, hyphenation and spacing differences do not matter. */
function applyHighlights(n){
  const el = pageEls[n-1];
  if(!el || el.dataset.done!=='1') return;
  el.querySelectorAll('.hl').forEach(x=>x.remove());
  const sents = Object.values(store.words).filter(w=>w.hl && w.doc===docName && w.page===n);
  if(!sents.length) return;
  const tl = el.querySelector('.textLayer'); if(!tl) return;
  const map=[]; let str='';
  const walker = document.createTreeWalker(tl, NodeFilter.SHOW_TEXT);
  for(let node; (node=walker.nextNode()); ){
    const d = node.data.toLowerCase();
    for(let i=0;i<d.length;i++){ const c=d.charCodeAt(i); if((c>=97&&c<=122)||(c>=48&&c<=57)){ str+=d[i]; map.push([node,i]); } }
  }
  const pr = el.getBoundingClientRect();
  for(const w of sents){
    const key = String(w.src||w.original).toLowerCase().replace(/[^a-z0-9]/g,'');
    if(key.length<4) continue;
    let i = str.indexOf(key), len = key.length;
    if(i<0){ i = str.indexOf(key.slice(0,40)); if(i<0) continue; len = Math.min(key.length, str.length-i); }
    const a = map[i], b = map[i+len-1];
    const range = document.createRange();
    range.setStart(a[0],a[1]); range.setEnd(b[0],b[1]+1);
    for(const rc of range.getClientRects()){
      if(rc.width<1 || rc.height<1) continue;
      const d = document.createElement('div'); d.className='hl';
      d.style.cssText = 'left:'+(rc.left-pr.left)+'px;top:'+(rc.top-pr.top)+'px;width:'+rc.width+'px;height:'+rc.height+'px';
      el.insertBefore(d, tl);
    }
  }
}
/* make each selectable span exactly as wide as the glyphs drawn on the canvas */
function alignSpans(divs, items, sc){
  if(divs.length!==items.length) return;
  const w = divs.map(d=>d.offsetWidth);
  for(let i=0;i<divs.length;i++){
    const it = items[i], d = divs[i];
    if(!it.str || !it.str.trim() || !w[i]) continue;
    const target = it.width*sc;
    if(!(target>0)) continue;
    const k = Math.max(.3, Math.min(3, target/w[i]));
    const t = d.style.transform || '';
    d.style.transform = /scaleX\([^)]*\)/.test(t) ? t.replace(/scaleX\([^)]*\)/,'scaleX('+k.toFixed(4)+')') : (t+' scaleX('+k.toFixed(4)+')').trim();
  }
}

const GENERAL='英語學術寫作常用字', UNSORTED='未分類', LS_VOCAB='rie.vocab.v1';

(function(){ const s=lsGet(LS_VOCAB); if(s && s.words && Array.isArray(s.lists)) store=s; store.docs=store.docs||{}; })();
function saveStore(){ if(!lsSet(LS_VOCAB,store)) toast('無法儲存生詞表（瀏覽器儲存空間不可用）'); }
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function cleanName(n){ return String(n||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,24); }
function ensureList(name, locked){
  name = cleanName(name) || UNSORTED;
  const l = store.lists.find(x=>x.name===name);
  if(!l) store.lists.push({name, locked:!!locked}); else if(locked) l.locked=true;
  return name;
}
function allWords(){ return Object.values(store.words).sort((a,b)=>(b.t||0)-(a.t||0)); }
function listCounts(){
  const m = new Map(store.lists.map(l=>[l.name,0]));
  for(const w of Object.values(store.words)) m.set(w.list,(m.get(w.list)||0)+1);
  return m;
}
function pruneLists(){
  const c = listCounts();
  store.lists = store.lists.filter(l=>l.locked || (c.get(l.name)||0)>0);
}
function upsertWord(r, suggestedList){
  const k = norm(r.original); if(!k) return null;
  const old = store.words[k];
  const w = Object.assign({}, r, {k, t:Date.now(), n:(old?old.n:0)+1, starred: old?old.starred:false, manual: old?old.manual:false, doc: docName || (old&&old.doc) || ''});
  w.list = old ? old.list : ensureList(suggestedList);
  store.words[k]=w; saveStore(); return w;
}

規則：
- 一般詞彙或句子的 term 必須為 null；專有名詞、學術術語、縮寫、實驗方法、試劑、儀器、基因或蛋白質名稱，kind 設為 "term" 並填寫 term。
- list 的決定方式：非特定領域的一般學術用字、連接詞、寫作句型 → 「${GENERAL}」。專業詞彙依研究方向歸類：優先放進上面現有清單中合適的一份；都不合適才取一個新的清單名稱（繁體中文、簡短的研究方向名稱，例如「神經科學」「奈米材料」「無機化學合成」）。新清單的範圍粗細要比照使用者現有的清單：現有清單分得細就取細的名稱，分得粗或還沒有專業清單就取較廣的領域名稱。
- 選取的是句子時，list 依這句話談的研究主題歸類（同樣優先用現有清單）；與特定領域無關、主要可當寫作句型參考的句子 → 「${GENERAL}」。
- 所有中文一律使用繁體中文與臺灣慣用學術譯名，不使用簡體字或中國大陸用語。
- 不確定時請在 note 中誠實說明，不要捏造。`;
}
function normalize(d, sel){
  d = (d && typeof d==='object') ? d : {};
  const arr = a => Array.isArray(a) ? a.map(String).filter(Boolean) : [];
  const t = d.term && typeof d.term==='object' ? d.term : null;
  return {
    kind: ['word','term','phrase','sentence'].includes(d.kind) ? d.kind : 'word',
    original: String(d.original||sel.text),
    pronunciation: String(d.pronunciation||''),
    pos: String(d.pos||''),
    translation: String(d.translation||'（沒有取得翻譯）'),
    other: arr(d.other_meanings).slice(0,3),
    term: t ? {full:String(t.full_name||''), field:String(t.field||''), meaning:String(t.meaning||''), related:arr(t.related).slice(0,4)} : null,
    note: String(d.note||''),
    page: sel.page
  };
}
async function lookup(sel){
  showTab('tr');
  if(matchMedia('(max-width:860px)').matches) $('#side').classList.remove('collapsed');
  await ready;
  const src = source();
  if((src==='claude' && !canAsk()) || (src==='google' && !settings.googleKey)){ renderIdle(); return; }
  lastLookedUp = sel.text;
  if(ctl) ctl.abort();
  const mine = ++reqId; ctl = new AbortController();
  renderLoading(sel.text);
  if(src!=='claude'){ lookupFree(sel, mine, ctl.signal); return; }
  const ctx = await getContext(sel.text, sel.page);
  if(mine!==reqId) return;
  try{
    const data = await askJSON(buildPrompt(sel.text,ctx), sel.text.length>120 ? 'default' : 'quick', ctl.signal);
    if(mine!==reqId) return;
    const r = normalize(data, sel); r.src = sel.text;
    const long = r.kind==='sentence' || r.original.length>80;
    let w;
    if(long){
      r.kind='sentence'; r.listSuggest = cleanName(data && data.list);
      const old = store.words[norm(r.original)];
      w = old && old.hl ? old : r;
    }else w = upsertWord(r, data && data.list) || r;
    renderCard(w);
    renderVocab();
    if(canFetchRefs && settings.refs && w.kind==='term') attachRefs(w, ctl.signal);
  }catch(e){
    if(mine!==reqId || (e && e.code==='cancelled')) return;
    renderError(ERR[e && e.code] || '翻譯失敗，請再試一次。', sel, e && e.code);
  }
}
/* Look something up without Claude: machine translation (Chrome built-in or Google) plus,
   for words and terms, Wikipedia (Chinese name + summary) and PubMed (usage in the literature). */
async function lookupFree(sel, mine, signal){
  const text = sel.text.replace(/^[^A-Za-z0-9(]+|[^A-Za-z0-9).?!%]+$/g,'');
  const isSentence = text.split(/\s+/).length>6 || text.length>80;
  const [mtR, refsR] = await Promise.allSettled([machineTranslate(text, signal), isSentence ? Promise.resolve(null) : fetchRefs(text, signal)]);
  if(mine!==reqId) return;
  for(const x of [mtR, refsR]) if(x.status==='rejected' && x.reason && x.reason.code==='cancelled') return;
  if(mtR.status==='rejected' && source()==='google'){ const c = mtR.reason && mtR.reason.code; renderError(ERR[c] || 'Google 翻譯失敗，請再試一次。', sel, c); return; }
  const mt = mtR.status==='fulfilled' ? mtR.value : null;
  const refs = refsR.status==='fulfilled' ? refsR.value : null;
  if(isSentence){
    if(!mt){ renderError('這個瀏覽器沒有內建翻譯，免費來源無法翻譯句子。請到「設定」改用 Google 翻譯或 Claude。', sel, 'need_claude'); return; }
    renderCard({kind:'sentence', original:text, pronunciation:'', pos:'', translation:mt.text, via:mt.via, other:[], term:null, note:'', page:sel.page});
    return;
  }
  const wk = refs && refs.wiki, pm = refs && refs.pubmed;
  if(!mt && !wk && !(pm && pm.count)){
    renderError(refs && refs.failed ? ERR.network : '查不到這個詞。可以換個選取範圍，或到「設定」改用 Google 翻譯或 Claude。', sel, 'need_claude'); return;
  }
  const looksTerm = wk && (norm(wk.title)===norm(text) || /^[A-Z0-9-]{2,}$/.test(text));
  const r = {
    kind: looksTerm ? 'term' : (/\s/.test(text) ? 'phrase' : 'word'), original:text, pronunciation:'', pos:'',
    translation: mt ? mt.text : (wk ? (wk.zhTitle || '（維基百科沒有對應的中文條目）') : '（查無翻譯）'),
    via: mt ? mt.via : (wk ? '維基百科' : ''),
    other:[], note:'', page:sel.page, refs: refs && !refs.failed ? refs : null, free:true,
    // show the Wikipedia summary only when the article clearly is this term (or there is nothing else to show)
    term: wk && (looksTerm || !mt) ? {full: norm(wk.title)===norm(text) ? '' : wk.title, field:'', meaning: wk.zhExtract || wk.extract, related:[]} : null
  };
  const w = upsertWord(r, UNSORTED) || r;
  renderCard(w); renderVocab();
}
async function attachRefs(w, signal){
  try{
    const refs = await fetchRefs((w.term && w.term.full) || w.original, signal);
    if(refs.failed) return;
    w.refs = refs;
    if(w.k && store.words[w.k]){ store.words[w.k].refs = refs; saveStore(); }
    if(w.k ? cur.dataset.k===w.k : cur.dataset.o===w.original) renderCard(w.k && store.words[w.k] || w);
  }catch(e){}
}

const citeBusy = new Set();
function docInfo(name){ return (store.docs && store.docs[name]) || null; }
function shortCite(w){ const d=docInfo(w.doc); return [(d&&d.short)||w.doc||'', w.page?'p. '+w.page:''].filter(Boolean).join(', '); }
function fullCite(w){ const d=docInfo(w.doc); return (d&&d.cite)||w.doc||''; }
function citeText(w){ return '“'+w.original+'” ('+shortCite(w)+')\n'+w.translation+'\n來源：'+fullCite(w); }
function refreshCard(doc){ const k=cur.dataset.k; if(k && store.words[k] && (!doc || store.words[k].doc===doc)) renderCard(store.words[k]); }
function markSentence(r){
  const w = upsertWord(Object.assign({}, r, {kind:'sentence', hl:true}), r.listSuggest || UNSORTED);
  if(!w) return;
  renderCard(w); renderVocab(); applyHighlights(w.page);
  toast('已標記，收進「'+w.list+'」');
  ensureCitation(w.doc);
}
/* Work out the paper's reference once per PDF, from its first page and embedded metadata. */
async function ensureCitation(name){
  if(!name || !pdfDoc || name!==docName || citeBusy.has(name)) return;
  const d = docInfo(name); if(d && d.cite) return;
  citeBusy.add(name); refreshCard(name);
  let cite=name, short=name;
  try{
    let meta='';
    try{ const m = await pdfDoc.getMetadata(); const i=(m&&m.info)||{}; meta=[i.Title&&('Title: '+i.Title), i.Author&&('Author: '+i.Author), i.Subject&&('Subject: '+i.Subject)].filter(Boolean).join('\n'); }catch(e){}
    let first = pageTexts[1];
    if(!first){ const p=await pdfDoc.getPage(1); const tc=await p.getTextContent(); first=pageTexts[1]=tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' '); }
    const out = await askJSON(`以下是一篇學術論文 PDF 的檔名、內嵌資訊與第一頁文字。請辨識這篇文獻，只回傳一個 JSON 物件：
{"cite": "APA 第七版格式的完整引用（作者、年份、標題、期刊、卷期頁碼、DOI，資料中有的才寫）", "short": "文內引用的寫法，例如 Schneider et al., 2021（不要加括號）"}
只能根據下面提供的內容，看不出來的欄位直接省略，不可猜測或捏造；完全無法判斷時，cite 與 short 都填檔名。

檔名：${name}
PDF 內嵌資訊：
${meta||'（無）'}
第一頁文字：
${String(first||'').slice(0,3500)}`, 'default');
    if(out && out.cite) cite=String(out.cite).trim()||name;
    if(out && out.short) short=String(out.short).replace(/^[（(]|[)）]$/g,'').trim()||name;
  }catch(e){}
  store.docs[name] = {cite, short}; saveStore();
  citeBusy.delete(name); refreshCard(name); renderVocab();
}
function sourceBox(w){
  const box = h('div',{class:'srcbox'});
  const view = ()=>{
    box.textContent='';
    box.append(h('h3',null,'文獻來源', w.doc && !citeBusy.has(w.doc) && h('button',{class:'linkbtn',onclick:edit},'編輯')),
      ...(citeBusy.has(w.doc) ? [h('div',{class:'cite'},'辨識中…')] : [h('div',{class:'short'},'('+shortCite(w)+')'), h('div',{class:'cite'},fullCite(w))]));
  };
  const edit = ()=>{
    const d = docInfo(w.doc) || {cite:w.doc, short:w.doc};
    const ta = h('textarea',{'aria-label':'完整引用'}); ta.value = d.cite;
    const si = h('input',{class:'inp',type:'text','aria-label':'文內引用',style:'width:100%;margin-top:6px'}); si.value = d.short;
    box.textContent='';
    box.append(h('h3',null,'文獻來源'), ta, si, h('div',{class:'actions',style:'margin-top:8px'},
      h('button',{class:'btn sm primary',onclick:()=>{ store.docs[w.doc]={cite:ta.value.trim()||w.doc, short:si.value.trim()||w.doc, manual:true}; saveStore(); view(); renderVocab(); }},'儲存'),
      h('button',{class:'btn sm',onclick:view},'取消')));
  };
  view();
  return box;
}

function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('已複製'),()=>toast('無法複製')); }catch(e){ toast('無法複製'); } }
function starButton(w){
  const b = h('button',{class:'starbtn'+(w.starred?' on':''),title:'星號','aria-label':'星號'}, w.starred?'★':'☆');
  b.addEventListener('click',e=>{

    w.starred=!w.starred; saveStore();

function listPicker(w){
  const sel = h('select',{'aria-label':'清單'});
  const names = store.lists.map(l=>l.name);
  if(!names.includes(w.list)) names.push(w.list);
  names.forEach(n=>sel.append(h('option',{value:n,selected:n===w.list},n)));
  sel.append(h('option',{value:'\u0000new'},'＋ 新增清單…'));
  const row = h('div',{class:'listrow'},'清單',sel);
  sel.addEventListener('change',()=>{
    if(sel.value==='\u0000new'){
      const inp = h('input',{type:'text',placeholder:'新清單名稱',maxlength:24});
      const ok = h('button',{class:'btn sm'},'加入');
      const go = ()=>{ const n=cleanName(inp.value); if(!n){ renderCard(w); return; } moveWord(w, ensureList(n,true)); };
      ok.addEventListener('click',go); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
      row.textContent=''; row.append('清單',inp,ok); inp.focus();

}
function moveWord(w, list){
  w.list=list; w.manual=true; pruneLists(); saveStore();

}
function link(href, text){ return h('a',{href, target:'_blank', rel:'noopener noreferrer'}, text); }
function refsBox(r){

function renderCard(r){
  const saved = !!(r.k && store.words[r.k]);
  cur.dataset.k = saved ? r.k : '';
  cur.dataset.o = r.original;
  const long = r.kind==='sentence' || r.original.length>60;
  const meta = h('div',{class:'meta'},
    h('span',{class:'chip'+(r.hl?' hlchip':r.kind==='term'?' term':' plain')}, r.hl?'重點句':KIND[r.kind]),
    r.pos && h('span',null,r.pos),
    r.pronunciation && h('span',null,/^[\/\[]/.test(r.pronunciation)?r.pronunciation:'/'+r.pronunciation+'/'),
    r.page && h('span',null,'第 '+r.page+' 頁'),
    r.via && h('span',null,r.via),
    saved && r.n>1 && h('span',null,'查過 '+r.n+' 次'));
  const card = h('div',{class:'card'},
    h('div',{class:'card-top'}, h('div',{class:'orig'+(long?' long':'')},r.original), saved && starButton(r)),
    meta,
    h('div',{class:'trans'},r.translation),
    r.other && r.other.length>0 && h('div',{class:'sub'},h('b',null,'其他詞義　'),r.other.join('；')),
    r.term && h('div',{class:'termbox'},
      h('h3',null, r.free ? '維基百科摘要' : '專有名詞說明', r.term.field && h('span',{class:'chip term'},r.term.field)),
      r.term.full && h('div',{class:'full'},r.term.full),
      r.term.meaning && h('p',null,r.term.meaning),
      r.term.related.length>0 && h('div',{class:'chips'},r.term.related.map(x=>h('span',{class:'chip plain'},x)))),
    r.note && h('div',{class:'sub'},h('b',null,'補充　'),r.note),
    refsBox(r),
    saved && r.hl && sourceBox(r),
    saved && listPicker(r),
    h('div',{class:'actions'},
      !saved && r.kind==='sentence' && source()==='claude' && canAsk() && h('button',{class:'btn sm primary',onclick:()=>markSentence(r)},'標記重點'),
      h('button',{class:'btn sm',onclick:()=>copyText(saved && r.hl ? citeText(r) : r.original+'\n'+r.translation+(r.term&&r.term.meaning?'\n'+r.term.meaning:''))}, saved && r.hl ? '複製（含來源）' : '複製'),
      canFetchRefs && !r.refs && !long && h('button',{class:'btn sm',onclick:e=>{ e.target.disabled=true; e.target.textContent='查詢中…'; attachRefs(r).then(()=>{ if(!r.refs){ e.target.textContent='查不到參考來源'; } }); }},'查維基百科與 PubMed'),
      saved && h('button',{class:'btn sm danger',onclick:()=>{ delete store.words[r.k]; pruneLists(); saveStore(); renderVocab(); renderIdle(); if(r.hl) applyHighlights(r.page); toast('已移除'); }},'移除')));
  cur.textContent=''; cur.append(card);
}

let vf = 'all', vtype = 'vo', reorgBusy=false, renaming=false;   // vtype: 'vo' words & terms, 'hl' key sentences
function showTab(t){
  if(t!=='tr'){ if(vtype!==t){ vtype=t; vf='all'; renaming=false; } renderVocab(); }
  for(const k of ['tr','vo','hl']) $('#tab-'+k).classList.toggle('on',t===k);
  $('#pane-tr').hidden = t!=='tr'; $('#pane-vo').hidden = t==='tr';

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ showTab(b.dataset.tab); if(matchMedia('(max-width:860px)').matches) $('#side').classList.remove('collapsed'); }));
function toTSV(ws){ return ws.map(w=>[w.original,w.translation,w.list,w.starred?'★':'', w.hl ? fullCite(w)+(w.page?' p. '+w.page:'') : ((w.term&&w.term.meaning)||'')].map(x=>String(x).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n'); }
function renderVocab(){
  const all = allWords(), global = listCounts();
  const nH = all.filter(w=>w.hl).length, nW = all.length-nH;
  $('#vcount').textContent = nW||''; $('#hcount').textContent = nH||'';
  const ws = all.filter(w=>!!w.hl===(vtype==='hl'));
  const counts = new Map(); for(const w of ws) counts.set(w.list,(counts.get(w.list)||0)+1);
  if(vf!=='all' && vf!=='star' && !global.has(vf)) vf='all';
  const isList = vf!=='all' && vf!=='star';
  const shown = vf==='all' ? ws : vf==='star' ? ws.filter(w=>w.starred) : ws.filter(w=>w.list===vf);

  const F = $('#filters'); F.textContent='';
  const chip = (id,label,n)=>h('button',{class:'fchip'+(vf===id?' on':''),onclick:()=>{ vf=id; renaming=false; renderVocab(); }},label,h('small',null,n));
  if(ws.length || isList){
    F.append(chip('all','全部',ws.length), chip('star','★',ws.filter(w=>w.starred).length));
    for(const l of store.lists) if(counts.get(l.name) || l.name===vf) F.append(chip(l.name,l.name,counts.get(l.name)||0));
  }

  const S = $('#suggest'); S.textContent='';
  const big = [...global].find(([n,c])=>n!==GENERAL && c>40);
  const small = [...global].filter(([n,c])=>c>0 && c<3 && n!==GENERAL).length;
  if(canAsk() && !reorgBusy && (big || small>=4)){
    S.append(h('div',{class:'suggest'}, big ? '「'+big[0]+'」可以細分' : '零星清單可以合併', h('button',{class:'btn sm primary',onclick:reorganize},'整理')));
  }

  const T = $('#vtools'); T.textContent='';
  if(renaming && isList){
    const inp = h('input',{class:'inp',type:'text',value:vf,maxlength:24,style:'flex:1'});
    const go = ()=>{
      const n = cleanName(inp.value); renaming=false;
      if(n && n!==vf){
        const old=vf; ensureList(n,true);
        for(const w of Object.values(store.words)) if(w.list===old) w.list=n;
        store.lists = store.lists.filter(l=>l.name!==old);
        vf=n; saveStore();
      }
      renderVocab();
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    T.append(inp, h('button',{class:'btn sm primary',onclick:go},'確定'), h('button',{class:'btn sm',onclick:()=>{ renaming=false; renderVocab(); }},'取消'));
  }else{
    if(all.length>=4) T.append(h('button',{class:'btn sm',disabled:reorgBusy||!canAsk(),onclick:reorganize}, reorgBusy?'整理中…':'重新整理分類'));
    if(isList) T.append(h('button',{class:'btn sm',onclick:()=>{ renaming=true; renderVocab(); }},'重新命名'));
    if(isList && !(global.get(vf)>0) && vf!==GENERAL) T.append(h('button',{class:'btn sm danger',onclick:()=>{ store.lists=store.lists.filter(l=>l.name!==vf); vf='all'; saveStore(); renderVocab(); }},'刪除清單'));
    if(shown.length) T.append(h('button',{class:'btn sm',onclick:()=>copyText(vtype==='hl' ? shown.slice().reverse().map(citeText).join('\n\n') : toTSV(shown.slice().reverse()))},'複製清單'));
  }

  const L = $('#vlist'); L.textContent='';
  if(!shown.length){ L.append(h('div',{class:'idle'}, vtype==='hl' ? '尚無重點句' : '尚無生詞')); return; }
  for(const w of shown){
    L.append(h('li',{class:w.hl?'sent':'',onclick:()=>{ renderCard(w); showTab('tr'); }},
      starButton(w),
      h('div',{style:'min-width:0'}, h('div',{class:'o'},w.original), h('div',{class:'t'}, w.hl ? '('+shortCite(w)+')' : w.translation)),
      !isList && h('span',{class:'l'},w.list)));
  }
}

/* Re-sort every word into lists whose granularity fits how many words there are
   and how the user has been organising them (renamed lists, manual moves). */
async function reorganize(){
  await ready;
  if(reorgBusy || !canAsk()) return;
  const ws = allWords().slice(0,600);
  if(ws.length<4){ toast('生詞還太少，不需要整理'); return; }
  reorgBusy=true; renderVocab();
  const locked = store.lists.filter(l=>l.locked).map(l=>l.name);
  const lines = ws.map((w,i)=>[i,w.original.slice(0,90),w.translation.slice(0,60),(w.term&&w.term.field)||'',w.list,w.manual?'固定':''].join('\t')).join('\n');
  const prompt = `你要幫一位台灣研究生整理英文文獻的生詞與重點句，把每一筆分到依「研究方向」命名的清單中（較長的是重點句，依它談的研究主題分類）。

目前的生詞（每行：編號、原文、翻譯、領域、目前清單、是否固定）：
${lines}

使用者自己建立或改過名字的清單（名稱必須原樣保留，可以繼續把詞放進去）：
${locked.map(n=>'- '+n).join('\n')||'（無）'}

分類規則：
1. 非特定領域的一般學術用字、連接詞、寫作句型，一律放「${GENERAL}」。
2. 專業詞彙依研究方向分類，清單名稱用繁體中文、簡短的研究方向名稱（如「神經科學」「奈米材料」「無機化學合成」）。
3. 範圍的精細程度由使用者的用量決定：理想上每份清單約 8–40 個詞。某個方向的詞超過 40 個且看得出子領域時，拆成更細的清單（例如把「神經科學」拆成「膠質瘤生物學」「突觸生理」）；只有 1–3 個詞的方向，併入最接近的較廣清單，不要為零星幾個詞開新清單。總詞數少時分得粗，詞數多的方向才分得細。
4. 參考使用者的習慣：標示「固定」的詞是使用者親手指定的，不可移動；它們所在的清單以及使用者自訂的清單，顯示了使用者偏好的命名方式與粗細，其他清單請比照。
5. 現有清單名稱若合適就沿用，不要無故改名。

只回傳一個 JSON 物件，不要有其他文字：{"assign": {"編號": "清單名稱", ...}}，每個不是「固定」的詞都要有一筆。`;
  try{
    const d = await askJSON(prompt,'default');
    const a = d && d.assign && typeof d.assign==='object' ? d.assign : null;
    if(!a) throw {code:'invalid_json'};
    let moved=0;
    ws.forEach((w,i)=>{
      const n = cleanName(a[i]); if(!n || w.manual) return;
      if(n!==w.list){ w.list=ensureList(n); moved++; } else ensureList(n);
    });
    pruneLists(); saveStore();
    toast(moved ? '已重新分類 '+moved+' 個詞' : '目前的分類已經合適');
  }catch(e){ toast(ERR[e && e.code] || '整理失敗，請再試一次'); }
  reorgBusy=false; renderVocab();
  const k = cur.dataset.k; if(k && store.words[k]) renderCard(store.words[k]);
}

/* =====================================================================
   Settings (standalone app only)
   ===================================================================== */
function openSettings(){
  $('#s-src').value=source(); $('#s-refs').checked=!!settings.refs;
  $('#s-gkey').value=settings.googleKey;
  $('#s-key').value=settings.apiKey; $('#s-mq').value=settings.modelQuick; $('#s-md').value=settings.modelDefault;
  $('#modal').classList.add('show');
}
function closeSettings(){ $('#modal').classList.remove('show'); }
$('#setbtn').onclick=openSettings;
$('#s-cancel').onclick=closeSettings;
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeSettings(); });
$('#s-save').onclick=()=>{
  settings.apiKey=$('#s-key').value.trim();
  settings.googleKey=$('#s-gkey').value.trim();
  settings.source=['claude','google'].includes($('#s-src').value)?$('#s-src').value:'free'; settings.refs=$('#s-refs').checked;
  settings.modelQuick=$('#s-mq').value.trim()||'claude-haiku-5-5';
  settings.modelDefault=$('#s-md').value.trim()||'claude-sonnet-5-5';
  lsSet('rie.settings.v1',settings); closeSettings();
  toast(settings.source==='claude' && !settings.apiKey ? '已儲存。使用 Claude 前請填入 API 金鑰' : settings.source==='google' && !settings.googleKey ? '已儲存。使用 Google 翻譯前請填入 API 金鑰' : '已儲存');
  if(!cur.querySelector('.card')) renderIdle();
  renderVocab();
};
function download(name, text, type){
  const a = h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('#s-export').onclick=()=>download('read-it-easier-vocab-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(store), 'application/json');
$('#s-tsv').onclick=()=>download('read-it-easier-vocab.tsv', '﻿原文\t翻譯\t清單\t星號\t說明或來源\n'+toTSV(allWords().reverse()), 'text/tab-separated-values');
$('#s-import').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || typeof d.words!=='object') throw 0;
    let n=0;
    for(const l of (d.lists||[])) if(l && l.name) ensureList(l.name, l.locked);
    for(const [k,v] of Object.entries(d.docs||{})) if(v && v.cite && !(store.docs[k] && store.docs[k].manual)) store.docs[k]=v;
    for(const [k,w] of Object.entries(d.words)){
      if(!w || !w.original) continue;
      const old = store.words[k];
      if(!old || (w.t||0)>(old.t||0)){ w.list=ensureList(w.list); store.words[k]=Object.assign({},w,{k,starred:!!(w.starred||(old&&old.starred))}); n++; }
      else if(w.starred) old.starred=true;
    }
    saveStore(); renderVocab(); toast('已匯入 '+n+' 個詞');
  }catch(err){ toast('這不是有效的備份檔'); }
});

/* =====================================================================
   Boot
   ===================================================================== */
updZoomLabel(); renderVocab();
if(!inClaude && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
